{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:20px auto">
  <h1>Change password</h1>
  <p class="sub">{{ g.user.email }}</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Current password</label><input type="password" name="current" required>
    <label>New password (at least 10 characters)</label><input type="password" name="new" required minlength="10">
    <label>Confirm new password</label><input type="password" name="confirm" required minlength="10">
    <p style="margin-top:18px"><button class="lg" style="width:100%">Change password</button></p>
  </form>
</div>
{% endblock %}
